{% extends "base.html" %}

{% block title %}Спасибо за участие{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h4">Спасибо за участие!</h1>
        <p class="text-muted">Ваш голос по опросу "{{ poll.title }}" учтён.</p>
        <div class="d-flex gap-2">
            <a href="{% url 'polls:poll_list' %}" class="btn btn-outline-secondary">К списку</a>
            <a href="{% url 'polls:poll_results' poll.id %}" class="btn btn-primary">Результаты</a>
        </div>
    </div>
</div>
{% endblock %}
